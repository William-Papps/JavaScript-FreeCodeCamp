<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>

<body>
  <main>
    <h1>Main Title of the Page</h1>
    <section>
      <h2>Title of the Song Playing</h2>
      <audio 
        controls 
        aria-label="Description label goes here"
        ><source 
          src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" 
          type="audio/mp3">
      </audio>
    </section>
    <section>
      <h2>Title of the Video Playing</h2>
      <video 
        controls
        width="100"
        aria-label="Label goes here"
        >
        <source 
          src="ttps://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4"
          type="video/mp4">
          <track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt"
          kind="video" srclang="en"
          label="English Subtitles">
          </track></video>
    </section>
    <section>
      <h2>Transcript</h2>
      <p>Transcript of the video</p>
    </section>
  </main>
</body>

</html>
