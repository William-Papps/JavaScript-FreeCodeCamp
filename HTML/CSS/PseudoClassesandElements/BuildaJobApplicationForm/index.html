<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <form>
            <label for="name">Full Name: </label>
            <input required type="text" id="name">

            <label for="email">Email: </label>
            <input required type="email" id="email">
            <label for="position">Position: </label>
            <select id="position" required>
                <option value="" disabled selected>Select a position</option>
                <option value="Developer">Developer</option>
                <option value="Designer">Designer</option>
                <option Value="Manager">Manager</option>
            </select>

            <fieldset name="availability" class="radio-group">
                <legend>Availability:</legend>
                <input checked id="full-time" type="radio" name="availability">
                <label for="full-time">Full-Time</label>
                <input id="part-time"type="radio" name="availability"> 
                <label for="part-time">Part-Time</label>
                
            </fieldset>
            <label for="message">Why do you want this job?</label>
                <textarea id="message" placeholder="Write your motivation" required ></textarea>
            <button type="submit">Submit</button>
    </div>

</body>
</html>
